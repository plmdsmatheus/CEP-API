services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cep}
      POSTGRES_DB: ${POSTGRES_DB:-cep}
    ports:
      # Porta do host configurável para não conflitar com outro Postgres local (5432/5433).
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
