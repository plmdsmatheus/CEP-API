[project]
name = "cep-api"
version = "0.1.0"
description = "API de consulta de CEP com histórico de consultas"
requires-python = ">=3.14,<3.15"
dependencies = ["fastapi (>=0.141.1,<0.142.0)", "uvicorn[standard] (>=0.54.0,<0.55.0)", "sqlalchemy (>=2)", "psycopg[binary] (>=3.3.6,<4.0.0)", "alembic (>=1.20.0,<2.0.0)", "pydantic-settings (>=2.15.0,<3.0.0)", "httpx (>=0.28.1,<0.29.0)"]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]
