server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # A API fica atrás do mesmo endereço do site: sem CORS e sem expor a porta da API.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Documentação interativa da API (Swagger UI).
    location = /docs {
        proxy_pass http://api:8000;
    }

    location = /openapi.json {
        proxy_pass http://api:8000;
    }

    # Arquivos com hash no nome nunca mudam: cache longo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Página única: qualquer outro caminho devolve o index.html (sempre revalidado).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
